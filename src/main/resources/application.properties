spring.application.name=app

# Server Port & Session Tracking
server.port=8085
server.servlet.session.tracking-modes=cookie

# Database Configuration (SQL Server Authentication)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=WebsiteBanMu;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File upload configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Custom property for upload directory
app.upload.dir=uploads

# Thymeleaf Cache (disable for live template rendering)
spring.thymeleaf.cache=false
