<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html_head('Thông tin cá nhân')}"></head>
<body class="profile-page d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-5 flex-grow-1 user-page-main">
        <h3 class="fw-bold mb-4"><i class="fa-solid fa-id-card text-primary me-2"></i>Thông tin tài khoản</h3>

        <!-- Alerts -->
        <div th:if="${successMessage}" class="alert alert-success border-0 rounded-3 shadow-sm py-3 mb-4" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger border-0 rounded-3 shadow-sm py-3 mb-4" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
        </div>

        <div class="row g-4">
            <!-- Account Overview Sidebar -->
            <div class="col-md-4">
                <div class="glass-card p-4 text-center">
                    <div class="mb-3">
                        <i class="fa-solid fa-circle-user text-primary" style="font-size: 6rem;"></i>
                    </div>
                    <h5 class="fw-bold mb-1" th:text="${customer.hoTen}"></h5>
                    <span class="badge bg-primary badge-premium mb-3" th:text="${customer.taiKhoan.vaiTro}"></span>
                    
                    <hr class="my-3">
                    
                    <div class="text-start mb-3">
                        <label class="text-muted small d-block">Tên đăng nhập:</label>
                        <span class="fw-bold" th:text="${customer.taiKhoan.tenDangNhap}"></span>
                    </div>
                    <div class="text-start">
                        <label class="text-muted small d-block">Trạng thái hoạt động:</label>
                        <span th:if="${customer.taiKhoan.trangThai == 'ACTIVE'}" class="badge bg-success">Đang hoạt động</span>
                        <span th:if="${customer.taiKhoan.trangThai != 'ACTIVE'}" class="badge bg-danger">Bị khóa</span>
                    </div>
                </div>
            </div>

            <!-- Profile Info Edit Form -->
            <div class="col-md-8">
                <div class="glass-card p-5">
                    <h5 class="fw-bold mb-4 border-bottom pb-2 text-primary"><i class="fa-solid fa-user-pen me-2"></i>Cập nhật thông tin</h5>
                    
                    <form th:action="@{/profile/update}" method="post">
                        <div class="mb-3">
                            <label for="hoTen" class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                            <input type="text" name="hoTen" id="hoTen" class="form-control" th:value="${customer.hoTen}" required minlength="2" maxlength="100" pattern="^[\p{L}\s\.\-\']{2,100}$" placeholder="Họ và tên...">
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="soDienThoai" class="form-label fw-semibold">Số điện thoại</label>
                                <input type="tel" name="soDienThoai" id="soDienThoai" class="form-control font-monospace" th:value="${customer.soDienThoai}" pattern="^0[35789][0-9]{8}$" maxlength="10" placeholder="10 số di động (03x, 05x, 07x, 08x, 09x)">
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold">Email</label>
                                <input type="email" name="email" id="email" class="form-control" th:value="${customer.email}" placeholder="Địa chỉ email...">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="diaChi" class="form-label fw-semibold">Địa chỉ mặc định</label>
                            <textarea name="diaChi" id="diaChi" class="form-control" rows="3" minlength="8" maxlength="255" placeholder="Ghi rõ số nhà, tên đường, phường/xã, quận/huyện..." th:text="${customer.diaChi}"></textarea>
                        </div>


                        <button type="submit" class="btn btn-primary px-4 py-2"><i class="fa-solid fa-floppy-disk me-2"></i>Lưu thay đổi</button>
                    </form>
                </div>

                <!-- Change Password Form -->
                <div class="glass-card p-5 mt-4">
                    <h5 class="fw-bold mb-4 border-bottom pb-2 text-danger"><i class="fa-solid fa-key me-2"></i>Đổi mật khẩu</h5>
                    
                    <form th:action="@{/profile/change-password}" method="post">
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">Mật khẩu hiện tại *</label>
                            <input type="password" name="currentPassword" id="currentPassword" class="form-control" required placeholder="Nhập mật khẩu hiện tại...">
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="newPassword" class="form-label">Mật khẩu mới *</label>
                                <input type="password" name="newPassword" id="newPassword" class="form-control" required minlength="6" placeholder="Tối thiểu 6 ký tự...">
                            </div>
                            <div class="col-md-6">
                                <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới *</label>
                                <input type="password" name="confirmPassword" id="confirmPassword" class="form-control" required minlength="6" placeholder="Nhập lại mật khẩu mới...">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-outline-danger px-4 py-2"><i class="fa-solid fa-shield-halved me-2"></i>Cập nhật mật khẩu</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
